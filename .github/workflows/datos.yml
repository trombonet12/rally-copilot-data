name: Datos Mallorca

# Genera los datos offline de Mallorca (mapa vectorial, estilo, vias, indice de busqueda, relieve y curvas de nivel
# del MDT05, teselas de enrutado Valhalla, radares DGT+OSM y, si toca, satelite PNOA z16 y z17) y los publica en una GitHub Release
# `datos-<AAAA.MM.DD>-<run>`. La app lee releases/latest/download/manifest.json.
#
# Cuatro jobs para que el codigo de terceros (Maven/Planetiler, npm, pip) nunca vea un token con escritura:
#   decidir      (contents: read)  -> version, etiqueta y si hay que regenerar el satelite z16 y el z17. Solo `gh`.
#   build        (contents: read)  -> genera todo en salida/ SIN GH_TOKEN y lo sube como artefacto.
#   satelite_z17 (contents: read)  -> PNOA z17 (opcional, varias horas) en un job propio y en paralelo; reanudable.
#   publicar     (contents: write) -> unico job con GH_TOKEN de escritura: manifest, comprobaciones, release y retencion.
# El z17 (`pnoa-mallorca-z17.pmtiles`) NO va en manifest.json sino en manifest-extra.json: las apps ya instaladas
# descargan todo lo que lista manifest.json y no ignoran ids desconocidos. Un fallo del z17 no bloquea la release.
# El mapa vectorial (mallorca.pmtiles) tambien se puede reutilizar de la ultima release (input `reutilizar_vectorial`, y
# automaticamente si osmdata.openstreetmap.de no deja bajar los poligonos de agua/tierra que necesita Planetiler): en
# ese caso `publicar` lo baja de la release y lo verifica contra su manifest, igual que el satelite.
# La decision del satelite va en un job previo (y no en build con la API publica sin autenticar) porque la API anonima
# tiene un limite de 60 peticiones/hora por IP, compartido con otros runners, y fallaria al azar.
on:
  schedule:
    - cron: '0 3 1 * *'
  workflow_dispatch:
    inputs:
      satelite:
        description: 'Regenerar el satelite PNOA z16 y z17 (si no, se reutilizan los de la ultima release)'
        type: boolean
        default: false
      reutilizar_vectorial:
        description: 'No ejecutar Planetiler: reutilizar el mapa vectorial (mallorca.pmtiles) de la ultima release'
        type: boolean
        default: false

permissions: {}

concurrency:
  group: datos
  cancel-in-progress: false

env:
  # oeste,sur,este,norte
  BBOX: '2.30,39.26,3.50,39.97'
  # github.com/protomaps/basemaps (carpeta tiles/)
  PROTOMAPS_SHA: 42ffaaa4a85a41bfcb23e43cc0f5b492a5eca123
  # github.com/protomaps/basemaps-assets (sprites y fuentes)
  ASSETS_SHA: 028c18f713baecad011301ff7a69acc39bcc2ae7
  # La version de @protomaps/basemaps esta fijada en estilo/package.json y estilo/package-lock.json.
  OSMIUM_PIP: '4.3.1'
  PMTILES: '1.31.2'
  PMTILES_SHA256: 3ed7dbf4ec2e6dfe5e25b6f70d1ffc932729f93c86db353bf514dd71010a312f
  GEOFABRIK: https://download.geofabrik.de/europe/spain/islas-baleares-latest.osm.pbf
  # NAP de la DGT: cabinas de cinemometro y tramos de velocidad media (DATEX II v1, publico y sin clave).
  DGT_RADARES: https://nap.dgt.es/datex2/dgt/PredefinedLocationsPublication/radares/content.xml
  # Debe coincidir con la version de Valhalla que lleva valhalla-mobile (0.6.4 -> submodulo Valhalla 3.9.1).
  # Digest del indice multi-arquitectura de la etiqueta 3.9.1 (obtenido del registro ghcr.io).
  VALHALLA_IMAGE: ghcr.io/valhalla/valhalla:3.9.1@sha256:4fd114eb1d26b8fc2f43bcb3df234c1b63a0bf13c277405e5943d5361dc575de

jobs:
  decidir:
    name: Version y decision del satelite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      regenerar: ${{ steps.sat.outputs.regenerar }}
      regenerar_z17: ${{ steps.sat.outputs.regenerar_z17 }}
    steps:
      - name: Version y etiqueta
        id: v
        run: |
          set -euo pipefail
          version="$(date -u +%Y.%m.%d)-${GITHUB_RUN_NUMBER}"
          {
            echo "version=$version"
            echo "tag=datos-$version"
          } >> "$GITHUB_OUTPUT"

      # Reutiliza el satelite de la ultima release salvo que se pida regenerarlo o no exista (con su manifest).
      - name: Satelite - regenerar o reutilizar
        id: sat
        env:
          GH_TOKEN: ${{ github.token }}
          SATELITE_INPUT: ${{ inputs.satelite }}
        run: |
          set -euo pipefail
          regenerar=true
          regenerar_z17=true
          if [ "$SATELITE_INPUT" != "true" ]; then
            activos="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null || true)"
            if printf '%s\n' "$activos" | grep -qx 'pnoa-mallorca-z16.pmtiles' \
              && printf '%s\n' "$activos" | grep -qx 'manifest.json'; then
              regenerar=false
            fi
            # El z17 se reutiliza si la ultima release lo trae junto con su manifest-extra.json.
            if printf '%s\n' "$activos" | grep -qx 'pnoa-mallorca-z17.pmtiles' \
              && printf '%s\n' "$activos" | grep -qx 'manifest-extra.json'; then
              regenerar_z17=false
            fi
          fi
          echo "Regenerar satelite z16: $regenerar; z17: $regenerar_z17"
          {
            echo "regenerar=$regenerar"
            echo "regenerar_z17=$regenerar_z17"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Generar datos
    needs: decidir
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      reutilizar_vectorial: ${{ steps.vec.outputs.reutilizar }}
    env:
      # Sin GH_TOKEN en ningun paso de este job: ejecuta Maven/Planetiler, npm y pip.
      VERSION: ${{ needs.decidir.outputs.version }}
      REUTILIZAR_INPUT: ${{ inputs.reutilizar_vectorial }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Tests de los scripts
        run: |
          set -euo pipefail
          python -I -m unittest discover -s scripts -p 'test_*.py'

      # Riesgo residual: `osmium` de PyPI se fija por version pero no por hash (no hay requirements con hashes);
      # --only-binary evita ejecutar setup.py de un sdist durante la instalacion.
      - name: Herramientas (osmium, pmtiles)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends osmium-tool
          python -m pip install --disable-pip-version-check -q --only-binary=:all: "osmium==${OSMIUM_PIP}"
          mkdir -p "$RUNNER_TEMP/pmtiles-dl" "$RUNNER_TEMP/bin"
          archivo="go-pmtiles_${PMTILES}_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pmtiles-dl/$archivo" \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES}/${archivo}"
          (cd "$RUNNER_TEMP/pmtiles-dl" && echo "${PMTILES_SHA256}  ${archivo}" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/pmtiles-dl/$archivo" -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          osmium --version
          "$RUNNER_TEMP/bin/pmtiles" version

      - name: Carpetas de trabajo
        run: mkdir -p salida trabajo/data/sources

      - name: PBF de Baleares (Geofabrik) recortado a Mallorca
        run: |
          set -euo pipefail
          mkdir -p trabajo/geofabrik
          curl -fsSL --retry 3 -o trabajo/geofabrik/islas-baleares-latest.osm.pbf "$GEOFABRIK"
          curl -fsSL --retry 3 -o trabajo/geofabrik/islas-baleares-latest.osm.pbf.md5 "${GEOFABRIK}.md5"
          (cd trabajo/geofabrik && md5sum -c islas-baleares-latest.osm.pbf.md5)
          osmium extract -b "$BBOX" --strategy=complete_ways --overwrite \
            -o trabajo/data/sources/mallorca.osm.pbf trabajo/geofabrik/islas-baleares-latest.osm.pbf
          osmium fileinfo trabajo/data/sources/mallorca.osm.pbf

      # Radares fijos, de tramo y zonas de radar movil: XML de la DGT + OSM (relaciones enforcement) -> un TSV de pocos KB
      # que va en manifest.json (id `radares`, opcional). Va aqui, antes de Planetiler, para que un cambio de formato de
      # la DGT o menos de 5 radares fijos / alguno fuera del bbox hagan fallar el job en minutos y no tras horas.
      # Si solo falla la descarga de la DGT, sale el TSV solo con OSM y un aviso.
      - name: Radares (DGT + OSM)
        run: |
          set -euo pipefail
          mkdir -p trabajo/dgt
          dgt=()
          if curl -fsSL --retry 3 --max-time 120 --max-filesize 20000000 -o trabajo/dgt/radares.xml "$DGT_RADARES"; then
            dgt=(--dgt trabajo/dgt/radares.xml)
          else
            echo "::warning::No se pudo descargar el XML de radares de la DGT: radares-mallorca.tsv solo con OSM"
          fi
          python -I scripts/radares.py --pbf trabajo/data/sources/mallorca.osm.pbf "${dgt[@]}"             --salida salida/radares-mallorca.tsv
          head -c 600 salida/radares-mallorca.tsv

      # Planetiler (protomaps/basemaps) baja de osmdata.openstreetmap.de los poligonos de agua y de tierra; si ese
      # servidor cae, el job fallaba siempre. Se cachean (clave mensual; restore-keys admite una anterior) y se bajan con
      # reintentos a trabajo/data/sources, donde Planetiler los toma sin volver a descargarlos. Si no hay forma de
      # tenerlos, se reutiliza el mapa vectorial de la ultima release (con aviso) en vez de fallar.
      - name: Poligonos de agua y tierra - mes
        id: mes
        if: env.REUTILIZAR_INPUT != 'true'
        run: echo "mes=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Poligonos de agua y tierra - cache
        id: cache
        if: env.REUTILIZAR_INPUT != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            trabajo/data/sources/water-polygons-split-3857.zip
            trabajo/data/sources/land-polygons-split-3857.zip
          key: osmdata-poligonos-${{ steps.mes.outputs.mes }}
          restore-keys: osmdata-poligonos-

      - name: Poligonos de agua y tierra - descarga con reintentos
        id: fuentes
        if: env.REUTILIZAR_INPUT != 'true'
        timeout-minutes: 60
        env:
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
        run: |
          set -uo pipefail
          dir=trabajo/data/sources
          base=https://osmdata.openstreetmap.de/download
          ok=true
          guardar=false
          for f in water-polygons-split-3857.zip land-polygons-split-3857.zip; do
            if [ "$CACHE_HIT" = "true" ] && [ -f "$dir/$f" ]; then
              echo "$f: de la cache"
              continue
            fi
            if curl -fsSL --retry 5 --retry-delay 30 --retry-all-errors --connect-timeout 30 \
                 --speed-limit 10000 --speed-time 60 -o "$dir/$f.tmp" "$base/$f" \
              && unzip -tq "$dir/$f.tmp" > /dev/null; then
              mv -f "$dir/$f.tmp" "$dir/$f"
              guardar=true
              echo "$f: descargado"
            else
              rm -f "$dir/$f.tmp"
              if [ -f "$dir/$f" ]; then
                echo "::warning::No se pudo descargar $f de osmdata.openstreetmap.de: se usa la copia de una cache anterior"
              else
                echo "::warning::No se pudo descargar $f de osmdata.openstreetmap.de y no hay cache previa"
                ok=false
                break
              fi
            fi
          done
          {
            echo "ok=$ok"
            echo "guardar=$guardar"
          } >> "$GITHUB_OUTPUT"

      - name: Poligonos de agua y tierra - guardar en la cache
        if: steps.fuentes.outputs.ok == 'true' && steps.fuentes.outputs.guardar == 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            trabajo/data/sources/water-polygons-split-3857.zip
            trabajo/data/sources/land-polygons-split-3857.zip
          key: osmdata-poligonos-${{ steps.mes.outputs.mes }}

      # reutilizar=true: no se ejecuta Planetiler y `publicar` toma mallorca.pmtiles de la ultima release.
      - name: Mapa vectorial - generar o reutilizar
        id: vec
        env:
          FUENTES_OK: ${{ steps.fuentes.outputs.ok }}
        run: |
          set -euo pipefail
          reutilizar=false
          if [ "$REUTILIZAR_INPUT" = "true" ]; then
            reutilizar=true
            echo "Mapa vectorial: se reutiliza el de la ultima release (input reutilizar_vectorial)"
          elif [ "$FUENTES_OK" != "true" ]; then
            reutilizar=true
            echo "::warning::Sin poligonos de agua/tierra de osmdata.openstreetmap.de: se reutiliza el mapa vectorial de la ultima release"
          fi
          echo "reutilizar=$reutilizar" >> "$GITHUB_OUTPUT"

      - name: Planetiler (protomaps/basemaps) y mapa vectorial
        if: steps.vec.outputs.reutilizar != 'true'
        run: |
          set -euo pipefail
          mkdir -p trabajo/basemaps
          cd trabajo/basemaps
          git init -q
          git remote add origin https://github.com/protomaps/basemaps.git
          git fetch -q --depth 1 origin "$PROTOMAPS_SHA"
          git checkout -q FETCH_HEAD
          cd tiles
          mvn -B -q package -DskipTests
          jars=("$PWD"/target/*-with-deps.jar)
          if [ "${#jars[@]}" -ne 1 ] || [ ! -f "${jars[0]}" ]; then
            echo "::error::No se encontro un unico *-with-deps.jar"
            exit 1
          fi
          # Planetiler se ejecuta desde trabajo/: busca data/sources/mallorca.osm.pbf y descarga el resto (--download).
          cd "$GITHUB_WORKSPACE/trabajo"
          java -Xmx6g -jar "${jars[0]}" --area=mallorca --bounds="$BBOX" --download --maxzoom=15 \
            --output="$GITHUB_WORKSPACE/salida/mallorca.pmtiles" --force
          pmtiles show "$GITHUB_WORKSPACE/salida/mallorca.pmtiles"

      - name: Vias (limites de velocidad)
        run: |
          set -euo pipefail
          python -I scripts/vias.py trabajo/data/sources/mallorca.osm.pbf salida/vias-mallorca.tsv.gz

      # Etiquetas para el motor de notas (puentes, tuneles, badenes, cruces...). El perfil de altura se anade despues
      # de descargar el MDT05 (paso «Perfil de altura de las vias»), que une todo en vias-notas-mallorca.tsv.gz.
      - name: Vias - etiquetas para las notas
        run: |
          set -euo pipefail
          python -I scripts/vias_notas.py etiquetas trabajo/data/sources/mallorca.osm.pbf trabajo/vias-notas-etiquetas.tsv

      # Los limites municipales (admin_level=8) se sacan del PBF completo de Baleares, no del recorte: osmium extract no
      # trae enteras las relaciones que salen del recuadro (Palma incluye Cabrera, fuera de el). tags-filter incluye
      # por defecto las vias y nodos miembros.
      - name: Busqueda (indice FTS5 de lugares, calles y POIs)
        run: |
          set -euo pipefail
          osmium tags-filter --overwrite -o trabajo/limites-municipios.osm.pbf \
            trabajo/geofabrik/islas-baleares-latest.osm.pbf r/admin_level=8
          python -I scripts/busqueda.py trabajo/data/sources/mallorca.osm.pbf salida/busqueda-mallorca.sqlite \
            --limites trabajo/limites-municipios.osm.pbf

      # Teselas de enrutado para valhalla-mobile: solo ejecuta la imagen oficial de Valhalla (fijada por digest).
      - name: Valhalla (teselas de enrutado)
        run: bash scripts/valhalla.sh trabajo/data/sources/mallorca.osm.pbf salida

      # MDT05 del IGN por WCS -> relieve Terrarium + curvas de nivel (PMTiles). El Python de GDAL es el del sistema.
      - name: Herramientas de relieve (GDAL, tippecanoe)
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gdal-bin python3-gdal python3-numpy tippecanoe
          gdalinfo --version
          command -v tippecanoe tile-join
          /usr/bin/python3 -I -c 'from osgeo import gdal; import numpy; print("python3-gdal", gdal.__version__, "numpy", numpy.__version__)'

      - name: Relieve y curvas de nivel (MDT05)
        timeout-minutes: 150
        run: bash scripts/relieve.sh salida

      # Reutiliza el VRT del MDT05 que deja relieve.sh en trabajo/relieve (no lo borra). Si falla, falla el job.
      - name: Perfil de altura de las vias (MDT05)
        timeout-minutes: 60
        run: |
          set -euo pipefail
          /usr/bin/python3 -I scripts/vias_notas.py perfil salida/vias-mallorca.tsv.gz trabajo/relieve/mdt05.vrt \
            trabajo/vias-notas-etiquetas.tsv salida/vias-notas-mallorca.tsv.gz

      # estilo.mjs resuelve `@protomaps/basemaps` desde su propia carpeta: se copia a estilo/, que tiene package.json y
      # package-lock.json (con integrity), y las dependencias se instalan con `npm ci` sin scripts.
      - name: Estilo del mapa (estilos, sprites y fuentes)
        run: |
          set -euo pipefail
          cp scripts/estilo.mjs estilo/estilo.mjs
          cd estilo
          npm ci --ignore-scripts --no-audit --no-fund
          node estilo.mjs "$GITHUB_WORKSPACE/trabajo/estilo-mapa" "$ASSETS_SHA"
          (cd "$GITHUB_WORKSPACE/trabajo/estilo-mapa" && zip -r -q "$GITHUB_WORKSPACE/salida/estilo-mapa.zip" .)

      - name: Satelite - descargar PNOA y convertir
        if: needs.decidir.outputs.regenerar == 'true'
        run: |
          set -euo pipefail
          python -I scripts/satelite.py --bbox "$BBOX" --zmax 16 --salida trabajo/pnoa.mbtiles
          pmtiles convert trabajo/pnoa.mbtiles salida/pnoa-mallorca-z16.pmtiles

      # Si el satelite se reutiliza, salida/ no lo incluye: lo aporta `publicar`.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: salida
          path: salida/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  # Satelite z17 (~150 000 peticiones al IGN; la mitad, mar, no se guarda): job propio y sin token para no alargar
  # `build`. El limite de un job de GitHub son 6 h: el paso de descarga corta a las 5 h 20 min y, si no termina,
  # guarda lo bajado en la cache para que al relanzar el workflow continue donde se quedo.
  satelite_z17:
    name: Satelite PNOA z17
    needs: decidir
    if: needs.decidir.outputs.regenerar_z17 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Herramienta pmtiles
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pmtiles-dl" "$RUNNER_TEMP/bin"
          archivo="go-pmtiles_${PMTILES}_Linux_x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/pmtiles-dl/$archivo" \
            "https://github.com/protomaps/go-pmtiles/releases/download/v${PMTILES}/${archivo}"
          (cd "$RUNNER_TEMP/pmtiles-dl" && echo "${PMTILES_SHA256}  ${archivo}" | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/pmtiles-dl/$archivo" -C "$RUNNER_TEMP/bin" pmtiles
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Tests de los scripts
        run: python -I -m unittest discover -s scripts -p 'test_*.py'

      - name: Cache del MBTiles parcial (reanudacion)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trabajo/pnoa-z17.mbtiles
          key: satelite-z17-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: satelite-z17-

      - name: Descargar PNOA z17
        id: descarga
        timeout-minutes: 320
        run: |
          set -euo pipefail
          mkdir -p trabajo
          python -I scripts/satelite.py --bbox "$BBOX" --zmin 17 --zmax 17 --salida trabajo/pnoa-z17.mbtiles

      # Solo si la descarga no termino (corte por tiempo o fallo): guarda el progreso para el siguiente intento.
      - name: Guardar progreso en la cache
        if: failure() && steps.descarga.outcome == 'failure'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: trabajo/pnoa-z17.mbtiles
          key: satelite-z17-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Convertir a PMTiles
        run: |
          set -euo pipefail
          mkdir -p salida-z17
          pmtiles convert trabajo/pnoa-z17.mbtiles salida-z17/pnoa-mallorca-z17.pmtiles
          pmtiles show salida-z17/pnoa-mallorca-z17.pmtiles
          bytes="$(stat -c %s salida-z17/pnoa-mallorca-z17.pmtiles)"
          echo "pnoa-mallorca-z17.pmtiles: $bytes bytes"
          # Limite de GitHub: 2 GiB por asset.
          if [ "$bytes" -ge 2147483648 ]; then
            echo "::error::pnoa-mallorca-z17.pmtiles supera 2 GiB"
            exit 1
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: satelite-z17
          path: salida-z17/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  publicar:
    name: Publicar release
    needs: [decidir, build, satelite_z17]
    # El z17 es opcional: si su job falla o se salta, la release sale igualmente (con el z17 de la anterior si lo hay).
    if: ${{ !cancelled() && needs.decidir.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      # Unico job con token de escritura. Solo ejecuta scripts propios (stdlib), `gh`, jq y utilidades del sistema.
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.decidir.outputs.version }}
      TAG: ${{ needs.decidir.outputs.tag }}
      REGENERAR: ${{ needs.decidir.outputs.regenerar }}
      REGENERAR_Z17: ${{ needs.decidir.outputs.regenerar_z17 }}
      REUTILIZAR_VECTORIAL: ${{ needs.build.outputs.reutilizar_vectorial }}
      Z17_RESULT: ${{ needs.satelite_z17.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: salida
          path: salida

      # Si no se regenera, el satelite viene de la ultima release y debe coincidir con el SHA-256 de su manifest.
      - name: Satelite - reutilizar el de la ultima release
        if: env.REGENERAR != 'true'
        run: |
          set -euo pipefail
          mkdir -p previo
          gh release download --repo "$GITHUB_REPOSITORY" --dir previo --clobber \
            --pattern 'pnoa-mallorca-z16.pmtiles' --pattern 'manifest.json'
          version_sat="$(jq -r '.archivos[] | select(.id == "satelite") | .version // empty' previo/manifest.json)"
          sha_sat="$(jq -r '.archivos[] | select(.id == "satelite") | .sha256 // empty' previo/manifest.json)"
          if [ -z "$version_sat" ] || ! printf '%s' "$sha_sat" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::El manifest previo no trae version y sha256 validos del satelite"
            exit 1
          fi
          (cd previo && echo "${sha_sat}  pnoa-mallorca-z16.pmtiles" | sha256sum -c -)
          mv previo/pnoa-mallorca-z16.pmtiles salida/pnoa-mallorca-z16.pmtiles
          echo "VERSION_SAT=$version_sat" >> "$GITHUB_ENV"
          echo "Satelite reutilizado (version $version_sat)"

      # Sin Planetiler (input o servidor de osmdata caido): mallorca.pmtiles viene de la ultima release y debe coincidir
      # con el SHA-256 que su manifest declara para el id `vectorial`. Conserva la version con la que se genero.
      - name: Mapa vectorial - reutilizar el de la ultima release
        if: env.REUTILIZAR_VECTORIAL == 'true'
        run: |
          set -euo pipefail
          mkdir -p previo-vec
          gh release download --repo "$GITHUB_REPOSITORY" --dir previo-vec --clobber \
            --pattern 'mallorca.pmtiles' --pattern 'manifest.json'
          version_vec="$(jq -r '.archivos[] | select(.id == "vectorial") | .version // empty' previo-vec/manifest.json)"
          sha_vec="$(jq -r '.archivos[] | select(.id == "vectorial") | .sha256 // empty' previo-vec/manifest.json)"
          if [ -z "$version_vec" ] || ! printf '%s' "$sha_vec" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::El manifest previo no trae version y sha256 validos del mapa vectorial"
            exit 1
          fi
          (cd previo-vec && echo "${sha_vec}  mallorca.pmtiles" | sha256sum -c -)
          mv previo-vec/mallorca.pmtiles salida/mallorca.pmtiles
          echo "VERSION_VEC=$version_vec" >> "$GITHUB_ENV"
          echo "Mapa vectorial reutilizado (version $version_vec)"

      - name: Mapa vectorial - version regenerada
        if: env.REUTILIZAR_VECTORIAL != 'true'
        run: echo "VERSION_VEC=$VERSION" >> "$GITHUB_ENV"

      - name: Satelite - version regenerada
        if: env.REGENERAR == 'true'
        run: echo "VERSION_SAT=$VERSION" >> "$GITHUB_ENV"

      - name: Satelite z17 - artefacto del job satelite_z17
        if: needs.satelite_z17.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: satelite-z17
          path: salida

      - name: Satelite z17 - version regenerada
        if: needs.satelite_z17.result == 'success'
        run: echo "VERSION_Z17=$VERSION" >> "$GITHUB_ENV"

      # Sin z17 nuevo (no tocaba regenerarlo, o su job fallo): se reutiliza el de la ultima release verificando su
      # SHA-256 contra manifest-extra.json. Si tocaba regenerarlo y no hay previo, la release sale sin z17.
      - name: Satelite z17 - reutilizar el de la ultima release
        if: needs.satelite_z17.result != 'success'
        run: |
          set -euo pipefail
          mkdir -p previo-z17
          if ! gh release download --repo "$GITHUB_REPOSITORY" --dir previo-z17 --clobber \
            --pattern 'pnoa-mallorca-z17.pmtiles' --pattern 'manifest-extra.json'; then
            if [ "$REGENERAR_Z17" != "true" ]; then
              echo "::error::La release previa deberia traer el satelite z17 y no se pudo descargar"
              exit 1
            fi
            echo "::warning::Sin satelite z17 (job satelite_z17: $Z17_RESULT) y la release previa no lo tiene"
            exit 0
          fi
          version_z17="$(jq -r '.archivos[] | select(.id == "satelite-z17") | .version // empty' previo-z17/manifest-extra.json)"
          sha_z17="$(jq -r '.archivos[] | select(.id == "satelite-z17") | .sha256 // empty' previo-z17/manifest-extra.json)"
          if [ -z "$version_z17" ] || ! printf '%s' "$sha_z17" | grep -qE '^[0-9a-f]{64}$'; then
            echo "::error::El manifest-extra previo no trae version y sha256 validos del satelite z17"
            exit 1
          fi
          (cd previo-z17 && echo "${sha_z17}  pnoa-mallorca-z17.pmtiles" | sha256sum -c -)
          mv previo-z17/pnoa-mallorca-z17.pmtiles salida/pnoa-mallorca-z17.pmtiles
          echo "VERSION_Z17=$version_z17" >> "$GITHUB_ENV"
          echo "Satelite z17 reutilizado (version $version_z17; job satelite_z17: $Z17_RESULT)"

      - name: Manifest y comprobaciones
        run: |
          set -euo pipefail
          extra=()
          if [ -n "${VERSION_Z17:-}" ]; then extra=(--version-z17 "$VERSION_Z17"); fi
          python3 -I scripts/manifest.py --carpeta salida --version "$VERSION" --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" --version-satelite "$VERSION_SAT" \
            --version-vectorial "$VERSION_VEC" "${extra[@]}"
          # Limite de GitHub: 2 GiB por asset.
          for f in salida/*; do
            bytes="$(stat -c %s "$f")"
            echo "$f: $bytes bytes"
            if [ "$bytes" -ge 2147483648 ]; then
              echo "::error::$f supera 2 GiB"
              exit 1
            fi
          done

      - name: Publicar release
        run: |
          set -euo pipefail
          mkdir -p trabajo
          {
            echo "Datos offline de Mallorca para Rally Copilot (versión $VERSION; satélite $VERSION_SAT; mapa vectorial $VERSION_VEC)."
            echo
            echo "Archivos:"
            jq -r '.archivos[] | "- `\(.nombre)`: \((.bytes / 1048576 | floor)) MiB (versión \(.version))"' salida/manifest.json
            echo '- `manifest.json`: índice con SHA-256 que lee la app.'
            if [ -f salida/manifest-extra.json ]; then
              jq -r '.archivos[] | "- `\(.nombre)`: \((.bytes / 1048576 | floor)) MiB (versión \(.version)); opcional, solo en `manifest-extra.json`"' salida/manifest-extra.json
              echo '- `manifest-extra.json`: índice de los archivos opcionales que la app no baja por defecto (satélite z17).'
            fi
            echo
            echo "Atribuciones: © OpenStreetMap contributors (ODbL 1.0); radares: DGT (NAP, CC BY); PNOA y MDT05 CC-BY 4.0 scne.es (IGN);"
            echo "Protomaps basemaps (BSD-3-Clause, CC0-1.0); fuentes Noto Sans (OFL-1.1)."
          } > trabajo/notas.md
          gh release create "$TAG" salida/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest \
            --title "Datos Mallorca $VERSION" --notes-file trabajo/notas.md

      # El satelite se vuelve a subir en cada release, asi que las antiguas se pueden borrar sin perderlo.
      - name: Retencion (ultimas 3 releases de datos)
        run: |
          set -euo pipefail
          antiguas="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | startswith("datos-"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName')"
          for t in $antiguas; do
            echo "Borrando release antigua $t"
            gh release delete "$t" --repo "$GITHUB_REPOSITORY" --cleanup-tag -y
          done
